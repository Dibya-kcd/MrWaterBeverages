<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F" />
      <stop offset="100%" stop-color="#0F2137" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  
  <!-- Inner Ring Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.8" />
  
  <!-- Centered "R" Distribution Motif -->
  <g filter="url(#shadow)" fill="url(#goldGrad)">
    <!-- Main stem -->
    <rect x="165" y="135" width="42" height="242" rx="12" />
    <!-- Loop -->
    <path d="M 190 135 L 290 135 C 345 135 375 165 375 210 C 375 255 345 285 290 285 L 190 285 Z M 207 172 L 207 248 L 285 248 C 318 248 335 235 335 210 C 335 185 318 172 285 172 Z" fill-rule="evenodd" />
    <!-- Leg -->
    <path d="M 270 270 L 360 377 L 310 377 L 230 282 Z" />
    <!-- Beverage / Bottle Sparkle -->
    <polygon points="360,140 368,160 388,168 368,176 360,196 352,176 332,168 352,160" fill="#FDE68A" />
  </g>
</svg>
